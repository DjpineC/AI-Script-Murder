<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CMD 剧本杀引擎</title>
<link rel="stylesheet" href="./index.css" />
</head>
<body>
<header>
  <h1>C:\\MURDER_MYSTERY&gt; ENGINE</h1>
  <div class="header-actions">
    <span id="statusBar">状态：未开始</span>
    <button id="settingsBtn">设置</button>
  </div>
</header>
<div class="main">
  <div class="terminal-wrap">
    <div class="terminal" id="terminal"></div>
    <div class="cmd-input-area">
      <span class="cmd-prompt">&gt;</span>
      <input type="text" id="cmdInput" autocomplete="off" spellcheck="false" />
    </div>
    <div class="mention-box" id="mentionBox"></div>
  </div>
  <div class="panel" id="panel">
    <h3>角色简介</h3>
    <div id="sidebarInfo">未开始</div>
  </div>
</div>

<div class="modal-overlay hidden" id="settingsModal">
  <div class="modal">
    <h2>设置 / 剧本加载</h2>
    <label>1. 选择剧本文件夹（内含 .json 文件）</label>
    <div class="row">
      <button id="chooseFolderBtn">选择文件夹</button>
      <select id="scriptFileSelect" class="hidden"></select>
      <button id="loadScriptBtn" class="hidden">加载选中剧本</button>
    </div>
    <div id="scriptInfo"></div>
    <hr style="border-color:#0f0; margin:10px 0;">
    <label>2. API 设置</label>
    <label>Base URL</label>
    <input type="text" id="baseUrl" placeholder="https://api.deepseek.com" />
    <label>API Key</label>
    <input type="password" id="apiKey" placeholder="sk-..." />
    <div class="row">
      <button id="fetchModelsBtn">获取模型</button>
      <button id="saveSettingsBtn">保存</button>
    </div>
    <label>模型</label>
    <select id="modelSelect"></select>
    <label>打字速度（毫秒/字符，建议 20-100）</label>
    <input type="number" id="typeSpeed" value="40" min="1" max="500" />
    <hr style="border-color:#0f0; margin:10px 0;">
    <label>3. 角色选择</label>
    <div class="row">
      <button id="selectAllRolesBtn">全选</button>
      <button id="deselectAllRolesBtn">全不选</button>
    </div>
    <div class="role-select-list" id="roleSelectList" style="max-height:200px; overflow-y:auto; border:1px dashed #0f0; padding:6px;"></div>
    <div style="margin-top:10px;">
      <button id="startGameBtn" style="width:100%;">开始游戏</button>
    </div>
    <div style="margin-top:8px; text-align:right;">
      <button id="closeSettingsBtn">关闭</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="voteOverlay">
  <div class="modal">
    <h2>投票：谁最可疑？</h2>
    <div id="voteCandidates"></div>
    <button id="submitVoteBtn" style="width:100%;margin-top:10px;">提交投票</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const terminal = $('terminal');
  const cmdInput = $('cmdInput');
  const mentionBox = $('mentionBox');
  const statusBar = $('statusBar');
  const scriptFileSelect = $('scriptFileSelect');
  const roleSelectList = $('roleSelectList');
  const sidebarInfo = $('sidebarInfo');
  const settingsModal = $('settingsModal');
  const voteOverlay = $('voteOverlay');

  const STORAGE_KEY = 'murder_mystery_transcript';
  const COST_PER_TOKEN = 0.84 / 1138567;
  const MEMORY_INTERVAL = 10;

  let scriptFiles = {};
  let parsedScript = null;
  let game = null;
  let abortController = null;
  let typeController = null;
  let mentionActive = false;
  let mentionItems = [];
  let mentionSel = 0;
  let autoQueue = [];
  let pendingAsk = null;
  let totalTokens = 0;
  let totalCacheHitTokens = 0;
  let totalCacheMissTokens = 0;
  let memoryTokenCost = 0;
  let memoryCacheHitTokens = 0;
  let memoryCacheMissTokens = 0;
  let dialogCounter = 0;

  let settings = {
    baseUrl: localStorage.getItem('baseUrl') || 'https://api.deepseek.com',
    apiKey: localStorage.getItem('apiKey') || '',
    model: localStorage.getItem('model') || '',
    typeSpeed: parseInt(localStorage.getItem('typeSpeed') || '40')
  };
  $('baseUrl').value = settings.baseUrl;
  $('apiKey').value = settings.apiKey;
  $('typeSpeed').value = settings.typeSpeed;

  function termPrint(text, cls = '') {
    const div = document.createElement('div');
    if (cls) div.className = cls;
    div.textContent = text;
    terminal.appendChild(div);
    terminal.scrollTop = terminal.scrollHeight;
  }
  function termError(text) { termPrint(text, 'error'); }
  function setStatus(text) { statusBar.textContent = '状态：' + text; }
  function focusInput() { cmdInput.focus(); }

  function typewrite(text, cls = 'ai', speed) {
    const speedMs = speed || settings.typeSpeed || 40;
    const div = document.createElement('div');
    if (cls) div.className = cls;
    terminal.appendChild(div);
    terminal.scrollTop = terminal.scrollHeight;
    let index = 0;
    let cancelled = false;
    let timer = null;
    typeController = {
      cancel: () => {
        cancelled = true;
        if (timer) clearTimeout(timer);
        if (index < text.length) {
          div.textContent += text.slice(index);
          terminal.scrollTop = terminal.scrollHeight;
        }
        typeController = null;
      }
    };
    function appendChar() {
      if (cancelled) return;
      if (index < text.length) {
        div.textContent += text[index];
        index++;
        terminal.scrollTop = terminal.scrollHeight;
        timer = setTimeout(appendChar, speedMs);
      } else {
        typeController = null;
      }
    }
    appendChar();
    return { done: new Promise(resolve => { const check = () => { if (cancelled || index >= text.length || typeController === null) resolve(); else setTimeout(check, 100); }; check(); }) };
  }

  function parseScript(content) {
    let data;
    try {
      data = JSON.parse(content);
    } catch (e) {
      throw new Error('剧本 JSON 解析失败：' + e.message);
    }
    if (!data.title || !data.brief || !data.rounds || !data.narration || !Array.isArray(data.roles) || !Array.isArray(data.evidence) || !data.truth || !data.storyEnd || !data.murderer) {
      throw new Error('剧本 JSON 缺少必要字段');
    }
    if (data.roles.length < 2) throw new Error('剧本至少需要2个角色');
    if (data.evidence.length !== data.rounds) throw new Error('搜证轮数与证据轮数不一致');
    data.roles.forEach(r => {
      if (!r.name || !r.identity || !r.goal || !r.secret || !r.prompt) {
        throw new Error(`角色「${r.name || '未知'}」缺少必要字段`);
      }
      r.isPlayer = false;
      r.longTermMemory = '';
    });
    return data;
  }

  function autoRestoreTranscript() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      terminal.innerHTML = '';
      const div = document.createElement('div');
      div.style.whiteSpace = 'pre-wrap';
      div.textContent = saved;
      terminal.appendChild(div);
      terminal.scrollTop = terminal.scrollHeight;
      termPrint('[系统] 已自动恢复上次游戏记录。', 'sys');
    }
  }

  $('chooseFolderBtn').addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.webkitdirectory = true;
    input.directory = true;
    input.addEventListener('change', async (e) => {
      const files = e.target.files;
      scriptFiles = {};
      scriptFileSelect.innerHTML = '';
      for (const file of files) {
        if (file.name.toLowerCase().endsWith('.json')) {
          try {
            const text = await file.text();
            scriptFiles[file.name] = text;
            const opt = document.createElement('option');
            opt.value = file.name;
            opt.textContent = file.name;
            scriptFileSelect.appendChild(opt);
          } catch (err) { console.error(err); }
        }
      }
      if (Object.keys(scriptFiles).length === 0) {
        $('scriptInfo').textContent = '未找到 .json 剧本文件';
        scriptFileSelect.classList.add('hidden');
        $('loadScriptBtn').classList.add('hidden');
      } else {
        scriptFileSelect.classList.remove('hidden');
        $('loadScriptBtn').classList.remove('hidden');
        $('scriptInfo').textContent = `已读取 ${Object.keys(scriptFiles).length} 个文件`;
      }
    });
    input.click();
  });

  $('loadScriptBtn').addEventListener('click', () => {
    const fname = scriptFileSelect.value;
    if (!fname || !scriptFiles[fname]) {
      $('scriptInfo').textContent = '请先选择剧本文件';
      return;
    }
    try {
      parsedScript = parseScript(scriptFiles[fname]);
      $('scriptInfo').textContent = `剧本「${parsedScript.title}」解析成功！`;
      renderRoleSelect();
      setStatus('剧本已加载');
    } catch (e) {
      $('scriptInfo').textContent = e.message;
      setStatus('剧本解析失败');
    }
  });

  function renderRoleSelect() {
    if (!parsedScript) return;
    roleSelectList.innerHTML = '';
    parsedScript.roles.forEach(role => {
      const label = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = false;
      cb.dataset.roleName = role.name;
      cb.addEventListener('change', () => updateRolePlayStatus());
      label.appendChild(cb);
      label.appendChild(document.createTextNode(`${role.name}（${role.identity}）`));
      roleSelectList.appendChild(label);
    });
  }
  function updateRolePlayStatus() {
    if (!parsedScript) return;
    const checkboxes = roleSelectList.querySelectorAll('input[type="checkbox"]');
    checkboxes.forEach(cb => {
      const role = parsedScript.roles.find(r => r.name === cb.dataset.roleName);
      if (role) role.isPlayer = cb.checked;
    });
  }
  $('selectAllRolesBtn').addEventListener('click', () => {
    roleSelectList.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = true);
    updateRolePlayStatus();
  });
  $('deselectAllRolesBtn').addEventListener('click', () => {
    roleSelectList.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
    updateRolePlayStatus();
  });

  $('saveSettingsBtn').addEventListener('click', () => {
    settings.baseUrl = $('baseUrl').value.trim().replace(/\/$/, '');
    settings.apiKey = $('apiKey').value.trim();
    settings.model = $('modelSelect').value;
    settings.typeSpeed = parseInt($('typeSpeed').value) || 40;
    localStorage.setItem('baseUrl', settings.baseUrl);
    localStorage.setItem('apiKey', settings.apiKey);
    localStorage.setItem('model', settings.model);
    localStorage.setItem('typeSpeed', settings.typeSpeed);
    termPrint('设置已保存。', 'sys');
  });
  $('fetchModelsBtn').addEventListener('click', async () => {
    const base = $('baseUrl').value.trim().replace(/\/$/, '');
    const key = $('apiKey').value.trim();
    if (!base || !key) { termError('请先填写 Base URL 和 API Key。'); return; }
    try {
      const res = await fetch(`${base}/models`, { headers: { 'Authorization': `Bearer ${key}` } });
      if (!res.ok) throw new Error(`获取模型失败：HTTP ${res.status}`);
      const data = await res.json();
      const models = data.data.map(m => m.id).sort();
      const sel = $('modelSelect');
      sel.innerHTML = '';
      models.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        sel.appendChild(opt);
      });
      if (models.length) {
        sel.value = settings.model && models.includes(settings.model) ? settings.model : models[0];
        termPrint(`获取到 ${models.length} 个模型。`, 'info');
      }
    } catch (e) { termError(e.message); }
  });
  if (settings.model) {
    const opt = document.createElement('option');
    opt.value = settings.model;
    opt.textContent = settings.model;
    $('modelSelect').appendChild(opt);
  }

  $('settingsBtn').addEventListener('click', () => settingsModal.classList.remove('hidden'));
  $('closeSettingsBtn').addEventListener('click', () => settingsModal.classList.add('hidden'));

  $('startGameBtn').addEventListener('click', () => {
    if (!parsedScript) { termError('请先加载剧本。'); return; }
    const selected = parsedScript.roles.filter(r => r.isPlayer);
    if (selected.length === 0) { termError('请至少选择一个角色由玩家扮演。'); return; }
    if (!$('baseUrl').value.trim() || !$('apiKey').value.trim() || !$('modelSelect').value) { termError('请先填写 API 设置并选择模型。'); return; }
    settings.baseUrl = $('baseUrl').value.trim().replace(/\/$/, '');
    settings.apiKey = $('apiKey').value.trim();
    settings.model = $('modelSelect').value;
    settings.typeSpeed = parseInt($('typeSpeed').value) || 40;
    localStorage.setItem('baseUrl', settings.baseUrl);
    localStorage.setItem('apiKey', settings.apiKey);
    localStorage.setItem('model', settings.model);
    localStorage.setItem('typeSpeed', settings.typeSpeed);

    game = {
      script: parsedScript,
      roles: parsedScript.roles.map(r => ({ ...r, isPlayer: r.isPlayer })),
      stage: 'intro',
      round: 0,
      publicHistory: [],
      currentSpeaker: null,
      hasIntroduced: new Set(),
    };
    totalTokens = 0;
    totalCacheHitTokens = 0;
    totalCacheMissTokens = 0;
    memoryTokenCost = 0;
    memoryCacheHitTokens = 0;
    memoryCacheMissTokens = 0;
    dialogCounter = 0;
    autoQueue = [];
    pendingAsk = null;
    settingsModal.classList.add('hidden');
    updateSidebar();
    terminal.innerHTML = '';
    termPrint(`=== 剧本「${game.script.title}」开始 ===`, 'narrator');
    termPrint(`旁白：${game.script.narration}`, 'narrator');
    game.publicHistory.push({ speaker: 'system', content: `旁白：${game.script.narration}` });
    termPrint('进入自我介绍阶段。输入 /help 查看命令。', 'info');
    setStatus('游戏进行中');
    focusInput();
  });

  function updateSidebar() {
    if (!game) { sidebarInfo.innerHTML = '未开始'; return; }
    let html = '<h3>我的角色</h3>';
    game.roles.filter(r => r.isPlayer).forEach(role => {
      html += `<div class="role-card">
        <div class="role-name">${role.name}</div>
        <div class="role-identity">${role.identity}</div>
        <div>目标：${role.goal}</div>
        <div class="role-secret">隐藏：${role.secret}</div>
      </div>`;
    });
    html += '<h3>其他角色</h3>';
    game.roles.filter(r => !r.isPlayer).forEach(role => {
      html += `<div class="role-card">
        <div class="role-name">${role.name}</div>
        <div class="role-identity">${role.identity}</div>
      </div>`;
    });
    html += '<h3>公开证据</h3>';
    if (game.round > 0 && game.script.evidence[game.round-1]) {
      game.script.evidence[game.round-1].forEach(ev => { html += `<div class="evidence-item">- ${ev}</div>`; });
    } else {
      html += '<div>尚未公开证据</div>';
    }
    sidebarInfo.innerHTML = html;
  }

  async function processAutoQueue() {
    if (!game || game.currentSpeaker || pendingAsk) return;
    if (autoQueue.length === 0) return;
    const roleName = autoQueue.shift();
    await generateAiSpeech(roleName);
    if (autoQueue.length > 0 && !pendingAsk) processAutoQueue();
  }

  async function fetchAiContent(messages, maxTokens = 500, temperature = 0.9) {
    const res = await fetch(`${settings.baseUrl}/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${settings.apiKey}` },
      body: JSON.stringify({ model: settings.model, messages, temperature, max_tokens: maxTokens, stream: false }),
      signal: abortController.signal
    });
    if (!res.ok) throw new Error(`API错误 ${res.status}`);
    const data = await res.json();
    return {
      content: (data.choices?.[0]?.message?.content || '').trim(),
      usage: data.usage || {}
    };
  }

  async function updateAllMemories() {
    if (!game || !settings.apiKey || !settings.model) return;
    const aiRoles = game.roles.filter(r => !r.isPlayer);
    if (aiRoles.length === 0) return;
    const recentDialog = game.publicHistory.filter(e => e.speaker !== 'system').slice(-MEMORY_INTERVAL);
    const recentTranscript = recentDialog.map(entry => {
      const speakerName = game.roles.find(r => r.name === entry.speaker)?.name || entry.speaker;
      return `${speakerName}：${entry.content}`;
    }).join('\n');

    let currentEvidence = '暂无';
    if (game.round > 0 && game.script.evidence[game.round-1]) {
      currentEvidence = game.script.evidence[game.round-1].join('；');
    }

    termPrint('[系统] 正在更新所有角色的长期记忆...', 'sys');
    let roundTokens = 0;
    let roundCacheHit = 0;
    let roundCacheMiss = 0;

    for (const role of aiRoles) {
      const systemPrompt = `你是剧本杀角色「${role.name}」。\n` +
        `你的公开身份：${role.identity}\n` +
        `你的个人目标：${role.goal}\n` +
        `你的隐藏秘密：${role.secret}\n` +
        `你之前的长期记忆：${role.longTermMemory || '无'}\n\n` +
        `当前公开证据：${currentEvidence}\n\n` +
        `以下是最近十句公开对话：\n${recentTranscript}\n\n` +
        `请根据以上信息，更新你的长期记忆摘要。\n` +
        `要求：\n- 只输出摘要本身，不要解释。\n- 必须保留你过去的记忆，并融入新信息。\n- 必须包含：谁在怀疑你、你在怀疑谁、你撒过的谎、对你不利的证据、你接下来要解释的事。\n- 不要复述原话。\n- 内容要像你自己在心里做的笔记。`;

      try {
        const result = await fetchAiContent([{ role: 'system', content: systemPrompt }], 800, 0.3);
        const memContent = result.content;
        const usage = result.usage || {};
        roundTokens += usage.total_tokens || 0;
        roundCacheHit += usage.prompt_cache_hit_tokens || 0;
        roundCacheMiss += usage.prompt_cache_miss_tokens || 0;
        if (memContent) role.longTermMemory = memContent;
      } catch (e) {
        termError(`记忆更新失败：${role.name}`);
      }
    }

    totalTokens += roundTokens;
    totalCacheHitTokens += roundCacheHit;
    totalCacheMissTokens += roundCacheMiss;
    memoryTokenCost += roundTokens;
    memoryCacheHitTokens += roundCacheHit;
    memoryCacheMissTokens += roundCacheMiss;

    const avgHit = getAverageCacheRate(roundCacheHit, roundCacheMiss);
    const totalCost = totalTokens * COST_PER_TOKEN;
    const memoryCost = memoryTokenCost * COST_PER_TOKEN;

    termPrint('[系统] 长期记忆更新完成。', 'info');
    termPrint(`记忆消耗 token：${roundTokens}`, 'sys');
    termPrint(`记忆平均缓存命中率：${avgHit}`, 'sys');
    termPrint(`记忆消耗预计：¥${memoryCost.toFixed(6)}`, 'sys');
    termPrint(`本局总 token：${totalTokens}，总花费约¥${totalCost.toFixed(6)}`, 'sys');
  }

  async function generateAiSpeech(roleName) {
    const role = game.roles.find(r => r.name === roleName);
    if (!role) return;
    if (!settings.apiKey || !settings.model) { termError('缺少 API 设置'); return; }
    const messages = buildAiMessages(roleName);
    abortController = new AbortController();
    game.currentSpeaker = roleName;
    termPrint(`[系统] ${role.name} 正在输入...`, 'sys');
    let content = '';
    let usage = {};
    try {
      const result = await fetchAiContent(messages);
      content = result.content;
      usage = result.usage;
      totalTokens += usage.total_tokens || 0;
      totalCacheHitTokens += usage.prompt_cache_hit_tokens || 0;
      totalCacheMissTokens += usage.prompt_cache_miss_tokens || 0;
      if (!content) content = '（沉默）';
      termPrint(`${role.name}：`, 'ai');
      await typewrite(content, 'ai', settings.typeSpeed).done;
      recordSpeech(roleName, content);
      const cacheInfo = getCacheInfo(usage);
      termPrint(`（本次：${usage.total_tokens || 0} token，总token：${totalTokens}，缓存命中率：${cacheInfo}，总花费约¥${(totalTokens * COST_PER_TOKEN).toFixed(6)}）`, 'sys');

      const mentionRegex = /@([^\s@]+)/g;
      const mentions = [];
      let m;
      while ((m = mentionRegex.exec(content)) !== null) mentions.push(m[1]);
      if (mentions.length > 0) {
        for (const name of mentions) {
          if (name === '所有人') continue;
          const targetRole = game.roles.find(r => r.name === name && !r.isPlayer);
          if (targetRole && targetRole.name !== roleName) {
            pendingAsk = { roleName, targetRoleName: targetRole.name };
            termPrint(`[系统] ${role.name} 想 @ ${targetRole.name}，允许发言吗？(0同意 1拒绝)`, 'prompt');
            focusInput();
            return;
          }
        }
      }
    } catch (e) {
      content = '……';
      termPrint(`${role.name}：`, 'ai');
      await typewrite(content, 'ai', settings.typeSpeed).done;
      recordSpeech(roleName, content);
      termPrint(`（请求失败，总token：${totalTokens}，总花费约¥${(totalTokens * COST_PER_TOKEN).toFixed(6)}）`, 'sys');
    } finally {
      game.currentSpeaker = null;
      abortController = null;
      if (autoQueue.length > 0 && !pendingAsk) processAutoQueue();
    }
  }

  function getCacheInfo(usage) {
    const hit = usage.prompt_cache_hit_tokens || 0;
    const miss = usage.prompt_cache_miss_tokens || 0;
    const totalPrompt = hit + miss;
    if (totalPrompt === 0) return '无数据';
    const rate = ((hit / totalPrompt) * 100).toFixed(1);
    return `${rate}%`;
  }

  function getAverageCacheRate(hit, miss) {
    const totalPrompt = hit + miss;
    if (totalPrompt === 0) return '无数据';
    return ((hit / totalPrompt) * 100).toFixed(1) + '%';
  }

  function buildAiMessages(roleName) {
    const role = game.roles.find(r => r.name === roleName);
    const otherRoles = game.roles.filter(r => r.name !== roleName).map(r => `${r.name}（${r.identity}）`).join('、');

    const fixedPrompt = `你是剧本杀游戏《${game.script.title}》中的角色「${role.name}」。\n` +
      `公开身份：${role.identity}\n` +
      `个人目标：${role.goal}\n` +
      `隐藏秘密：${role.secret}\n` +
      `初始提示词：${role.prompt}\n` +
      `公共背景：${game.script.brief}\n` +
      `其他角色：${otherRoles}\n` +
      `规则：你是一个真人玩家，不要暴露自己是AI。可以推理、怀疑、辩解、撒谎，但不要主动承认自己是凶手。发言要简短自然，像日常对话，优先回应玩家最近的发言。`;

    let currentEvidence = '（暂无公开证据）';
    if (game.round > 0 && game.script.evidence[game.round-1]) {
      currentEvidence = game.script.evidence[game.round-1].join('；');
    }

    const recentEntries = game.publicHistory.slice(-5);
    const recentTranscript = recentEntries.map(entry => {
      if (entry.speaker === 'system') return `系统：${entry.content}`;
      const speakerName = game.roles.find(r => r.name === entry.speaker)?.name || entry.speaker;
      return `${speakerName}：${entry.content}`;
    }).join('\n');

    const lastPlayerEntry = [...game.publicHistory].reverse().find(entry => game.roles.find(r => r.name === entry.speaker)?.isPlayer);
    const playerLast = lastPlayerEntry ? `${game.roles.find(r => r.name === lastPlayerEntry.speaker)?.name}：${lastPlayerEntry.content}` : '';

    return [
      { role: 'system', content: fixedPrompt },
      { role: 'user', content: `当前阶段：${game.stage}\n当前证据：${currentEvidence}\n你的长期记忆：${role.longTermMemory || '无'}\n最近对话：\n${recentTranscript}\n玩家最近发言：${playerLast || '无'}\n\n现在轮到你发言，请简短自然地发言。` }
    ];
  }

  function recordSpeech(roleName, content) {
    game.publicHistory.push({ speaker: roleName, content });
    if (roleName !== 'system') {
      dialogCounter++;
      if (dialogCounter >= MEMORY_INTERVAL) {
        dialogCounter = 0;
        setTimeout(() => {
          updateAllMemories();
        }, 300);
      }
    }
  }

  function enterRound(roundNum) {
    if (!game) return;
    game.round = roundNum;
    game.stage = 'investigation';
    termPrint(`\n=== 第 ${roundNum} 轮搜证开始 ===`, 'narrator');
    const evidence = game.script.evidence[roundNum-1];
    if (evidence) {
      termPrint(`【第${roundNum}轮证据公开】`, 'evidence');
      evidence.forEach(ev => termPrint(ev, 'evidence'));
      game.publicHistory.push({ speaker: 'system', content: `【第${roundNum}轮证据公开】\n${evidence.join('\n')}` });
    }
    game.currentSpeaker = null;
    autoQueue = [];
    pendingAsk = null;
    updateSidebar();
    if (roundNum === game.script.rounds) termPrint(`本轮为最后一轮搜证。讨论结束后可输入 /vote 进入投票。`, 'info');
    else termPrint(`本轮讨论中，可输入 /search 进入下一轮搜证。`, 'info');
  }

  function endIntro() {
    if (!game || game.stage !== 'intro') return;
    enterRound(1);
  }

  function sendPlayerMessage(content) {
    if (!game) { termError('游戏尚未开始。'); return; }
    content = content.trim();
    if (!content) return;

    if (pendingAsk) {
      if (content === '0' || content === '1') {
        const targetRoleName = pendingAsk.targetRoleName;
        const targetRole = game.roles.find(r => r.name === targetRoleName);
        const asker = game.roles.find(r => r.name === pendingAsk.roleName);
        pendingAsk = null;
        if (content === '0') {
          termPrint(`[系统] 已同意 ${asker.name} 的 @，${targetRole.name} 将发言。`, 'sys');
          autoQueue.unshift(targetRoleName);
        } else {
          termPrint(`[系统] 已拒绝 ${asker.name} 的 @。`, 'sys');
        }
        focusInput();
        processAutoQueue();
        return;
      } else {
        termPrint('[系统] 请输入 0 同意或 1 拒绝。', 'sys');
        focusInput();
        return;
      }
    }

    if (content.startsWith('/')) { handleCommand(content); return; }

    if (game.currentSpeaker) {
      termPrint('[系统] 当前 AI 正在发言，你的消息将在其发言结束后自动显示。', 'sys');
      setTimeout(() => sendPlayerMessage(content), 500);
      return;
    }

    const roleName = game.currentRoleName || game.roles.filter(r => r.isPlayer)[0]?.name;
    const role = game.roles.find(r => r.name === roleName);
    if (!role) { termError('请先选择当前发言身份，使用 /role 名字'); return; }
    termPrint(`${role.name}：${content}`, 'player');
    recordSpeech(roleName, content);
    updateSidebar();

    const mentionRegex = /@([^\s@]+)/g;
    const mentions = [];
    let match;
    while ((match = mentionRegex.exec(content)) !== null) mentions.push(match[1]);

    if (mentions.includes('所有人')) {
      autoQueue = game.roles.filter(r => !r.isPlayer).map(r => r.name);
      processAutoQueue();
      return;
    }

    if (mentions.length > 0) {
      const targetNames = [];
      mentions.forEach(name => {
        if (name === '所有人') return;
        const mentionedRole = game.roles.find(r => r.name === name && !r.isPlayer);
        if (mentionedRole && !targetNames.includes(mentionedRole.name)) targetNames.push(mentionedRole.name);
      });
      if (targetNames.length > 0) { autoQueue = targetNames; processAutoQueue(); }
    }
  }

  function handleCommand(cmd) {
    const parts = cmd.trim().split(/\s+/);
    const main = parts[0].toLowerCase();
    switch (main) {
      case '/help': termPrint('/help /role /endintro /search /vote /trigger /copy /tokens /status /settings /brain', 'sys'); break;
      case '/brain':
        if (!game) { termError('游戏未开始。'); break; }
        if (parts.length < 2) { termError('用法：/brain 角色名字'); break; }
        const brainName = parts.slice(1).join(' ');
        const brainRole = game.roles.find(r => r.name === brainName && !r.isPlayer);
        if (!brainRole) { termError(`找不到该角色：${brainName}`); break; }
        termPrint(`=== ${brainRole.name} 的大脑 ===`, 'info');
        termPrint(`公开身份：${brainRole.identity}`, 'sys');
        termPrint(`个人目标：${brainRole.goal}`, 'sys');
        termPrint(`隐藏秘密：${brainRole.secret}`, 'sys');
        termPrint(`初始提示词：${brainRole.prompt}`, 'sys');
        termPrint(`长期记忆：${brainRole.longTermMemory || '无'}`, 'sys');
        const currentEvidence = game.round > 0 && game.script.evidence[game.round-1] ? game.script.evidence[game.round-1].join('；') : '暂无';
        termPrint(`当前证据：${currentEvidence}`, 'sys');
        const recentTranscript = game.publicHistory.slice(-5).map(entry => {
          if (entry.speaker === 'system') return `系统：${entry.content}`;
          const speakerName = game.roles.find(r => r.name === entry.speaker)?.name || entry.speaker;
          return `${speakerName}：${entry.content}`;
        }).join('\n');
        termPrint(`最近对话：\n${recentTranscript}`, 'sys');
        break;
      case '/role':
        if (parts.length < 2) { termError('用法：/role 角色名字'); break; }
        const name = parts.slice(1).join(' ');
        const role = game.roles.find(r => r.isPlayer && r.name === name);
        if (!role) { termError(`找不到该玩家角色：${name}`); break; }
        game.currentRoleName = role.name;
        termPrint(`[系统] 当前发言身份切换为 ${role.name}`, 'sys');
        updateSidebar();
        break;
      case '/endintro': endIntro(); break;
      case '/search':
        if (!game) { termError('游戏未开始。'); break; }
        if (game.stage !== 'investigation') { termError('当前不在搜证阶段。'); break; }
        if (game.round >= game.script.rounds) { termError('已是最后一轮搜证。'); break; }
        enterRound(game.round + 1);
        break;
      case '/vote':
        if (!game) { termError('游戏未开始。'); break; }
        if ((game.stage === 'investigation' && game.round === game.script.rounds) || game.stage === 'discussion') openVote();
        else termError('当前不能投票。');
        break;
      case '/trigger':
        if (!game) { termError('游戏未开始。'); break; }
        const available = game.roles.filter(r => !r.isPlayer && !autoQueue.includes(r.name) && game.currentSpeaker !== r.name);
        if (available.length === 0) { termPrint('暂无可请求发言的 AI。', 'sys'); break; }
        autoQueue.push(available[Math.floor(Math.random() * available.length)].name);
        processAutoQueue();
        break;
      case '/copy': copyTranscript(); break;
      case '/tokens': termPrint(`本局当前总 token：${totalTokens}，总花费约¥${(totalTokens * COST_PER_TOKEN).toFixed(6)}`, 'info'); break;
      case '/status':
        if (!game) { termError('游戏未开始。'); break; }
        updateSidebar();
        termPrint(sidebarInfo.textContent, 'sys');
        break;
      case '/settings': settingsModal.classList.remove('hidden'); break;
      default: termError('未知命令，输入 /help 查看帮助。');
    }
  }

  function copyTranscript() {
    const content = terminal.innerText || terminal.textContent;
    if (!content) { termError('暂无可复制的记录。'); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(content).then(() => termPrint('[系统] 全部记录已复制到剪贴板。', 'sys'))
        .catch(err => termError('复制失败：' + err.message));
    } else {
      const textarea = document.createElement('textarea');
      textarea.value = content;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      termPrint('[系统] 全部记录已复制到剪贴板。', 'sys');
    }
  }

  function openVote() {
    if (!game) return;
    game.stage = 'voting';
    updateSidebar();
    const overlay = $('voteOverlay');
    overlay.classList.remove('hidden');
    const container = $('voteCandidates');
    container.innerHTML = '';
    game.roles.forEach(r => {
      const div = document.createElement('div');
      div.className = 'candidate';
      div.textContent = r.name + '（' + r.identity + '）';
      div.dataset.roleName = r.name;
      div.addEventListener('click', () => {
        container.querySelectorAll('.candidate').forEach(c => c.classList.remove('selected'));
        div.classList.add('selected');
        container.dataset.selected = r.name;
      });
      container.appendChild(div);
    });
  }

  $('submitVoteBtn').addEventListener('click', () => {
    const selected = $('voteCandidates').dataset.selected;
    if (!selected) { termError('请选择一名嫌疑人。'); return; }
    const role = game.roles.find(r => r.name === selected);
    const isCorrect = (selected === game.script.murderer);
    $('voteOverlay').classList.add('hidden');
    termPrint('\n=== 投票结果 ===', 'narrator');
    termPrint(`你投给了：${role.name}`, 'info');
    termPrint(isCorrect ? '恭喜！你投对了！' : `很遗憾，你投错了。真正的凶手是：${game.script.murderer}`, isCorrect ? 'info' : 'warn');
    termPrint('\n=== 真相揭晓 ===', 'narrator');
    termPrint(game.script.truth, 'evidence');
    termPrint('\n=== 结局 ===', 'narrator');
    termPrint(game.script.storyEnd, 'info');
    game.stage = 'ended';
    updateSidebar();
    setStatus('游戏结束');
  });

  cmdInput.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const input = cmdInput.value;
      const tokens = input.split(/\s+/);
      const lastToken = tokens[tokens.length-1];
      if (lastToken.startsWith('/')) {
        const cmds = ['/help', '/role', '/search', '/vote', '/endintro', '/trigger', '/status', '/settings', '/copy', '/tokens', '/brain'];
        const matches = cmds.filter(c => c.startsWith(lastToken));
        if (matches.length === 1) { tokens[tokens.length-1] = matches[0]; cmdInput.value = tokens.join(' '); }
        else if (matches.length > 1) termPrint('可能的补全：' + matches.join('  '), 'sys');
      } else if (lastToken.startsWith('@')) {
        const query = lastToken.slice(1).toLowerCase();
        const allRoles = game ? game.roles.filter(r => !r.isPlayer).map(r => r.name) : [];
        const matches = allRoles.filter(name => name.toLowerCase().startsWith(query));
        if (matches.length === 1) { tokens[tokens.length-1] = '@' + matches[0]; cmdInput.value = tokens.join(' '); }
        else { if (!mentionActive) openMentionBox(); else { mentionSel = (mentionSel + 1) % mentionItems.length; updateMentionBox(); } }
      }
      return;
    }
    if (mentionActive && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
      e.preventDefault();
      mentionSel = e.key === 'ArrowUp' ? (mentionSel - 1 + mentionItems.length) % mentionItems.length : (mentionSel + 1) % mentionItems.length;
      updateMentionBox();
      return;
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      if (mentionActive) { chooseMentionItem(mentionItems[mentionSel]); return; }
      const content = cmdInput.value;
      cmdInput.value = '';
      sendPlayerMessage(content);
    }
    if (e.key === 'Escape' && mentionActive) closeMentionBox();
    if (e.key === '@') {
      setTimeout(() => {
        const val = cmdInput.value;
        const cursor = cmdInput.selectionStart;
        const before = val.slice(0, cursor);
        if (before.endsWith('@')) openMentionBox();
      }, 0);
    }
  });

  cmdInput.addEventListener('input', () => {
    if (mentionActive) {
      const val = cmdInput.value;
      const cursor = cmdInput.selectionStart;
      const before = val.slice(0, cursor);
      const atIdx = before.lastIndexOf('@');
      if (atIdx === -1 || before.slice(atIdx+1).includes(' ')) closeMentionBox();
      else filterMentionItems(before.slice(atIdx+1).toLowerCase());
    } else {
      const val = cmdInput.value;
      const cursor = cmdInput.selectionStart;
      const before = val.slice(0, cursor);
      const atIdx = before.lastIndexOf('@');
      if (atIdx !== -1 && !before.slice(atIdx+1).includes(' ')) openMentionBox();
    }
  });

  terminal.addEventListener('click', () => focusInput());

  function openMentionBox() {
    if (!game) return;
    mentionItems = ['所有人', ...game.roles.filter(r => !r.isPlayer).map(r => r.name)];
    mentionSel = 0;
    mentionActive = true;
    filterMentionItems('');
    updateMentionBox();
    mentionBox.style.display = 'block';
  }
  function closeMentionBox() { mentionActive = false; mentionBox.style.display = 'none'; }
  function filterMentionItems(query) {
    if (!mentionActive) return;
    mentionItems = ['所有人', ...game.roles.filter(r => !r.isPlayer).map(r => r.name)].filter(name => name.toLowerCase().includes(query.toLowerCase()));
    if (mentionSel >= mentionItems.length) mentionSel = 0;
    updateMentionBox();
  }
  function updateMentionBox() {
    mentionBox.innerHTML = '';
    if (mentionItems.length === 0) { mentionBox.style.display = 'none'; return; }
    mentionItems.forEach((name, idx) => {
      const div = document.createElement('div');
      div.className = 'mention-item' + (idx === mentionSel ? ' active' : '');
      div.textContent = name;
      div.addEventListener('click', () => chooseMentionItem(name));
      mentionBox.appendChild(div);
    });
  }
  function chooseMentionItem(name) {
    if (!mentionActive) return;
    closeMentionBox();
    const val = cmdInput.value;
    const cursor = cmdInput.selectionStart;
    const before = val.slice(0, cursor);
    const atIdx = before.lastIndexOf('@');
    if (atIdx !== -1) {
      cmdInput.value = before.slice(0, atIdx) + '@' + name + ' ' + val.slice(cursor);
      cmdInput.selectionStart = cmdInput.selectionEnd = atIdx + name.length + 2;
    } else {
      cmdInput.value += '@' + name + ' ';
    }
    focusInput();
  }

  autoRestoreTranscript();

  termPrint('C:\\MURDER_MYSTERY> 引擎就绪。', 'sys');
  termPrint('请先打开设置（点击右上角“设置”按钮），加载剧本并配置 API。', 'sys');
  focusInput();
})();
</script>
</body>
</html>
